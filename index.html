<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Senhas Seguras</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="conteudo">
        <div class="conteudo-titulo">
            <img src="https://via.placeholder.com/50" alt="Ícone de segurança">
            <h2 class="titulo-principal">Gerador de senhas</h2>
            <h3 class="titulo-secundario">Gere uma senha segura e personalizada</h3>
        </div>

        <div class="conteudo-senha">
            <label for="senha">Senha gerada:</label>
            <input name="senha" type="text" id="campo-senha" readonly>
        </div>

        <div class="parametro">
            <h3 class="parametro-titulo">Tamanho da senha</h3>
            <div class="parametro-coluna">
                <button class="parametro-senha__botao" id="diminuir">-</button>
                <span class="parametro-senha__texto" id="tamanho-senha">12</span>
                <button class="parametro-senha__botao" id="aumentar">+</button>
            </div>
        </div>

        <div class="parametro">
            <h3 class="parametro-titulo">Personalize sua senha</h3>
            <div class="parametro-checkbox">
                <input type="checkbox" name="letras-maiusculas" class="checkbox" checked>
                <label for="letras-maiusculas">Letras maiúsculas</label>
            </div>
            <div class="parametro-checkbox">
                <input type="checkbox" name="letras-minusculas" class="checkbox" checked>
                <label for="letras-minusculas">Letras minúsculas</label>
            </div>
            <div class="parametro-checkbox">
                <input type="checkbox" name="numeros" class="checkbox" checked>
                <label for="numeros">Números</label>
            </div>
            <div class="parametro-checkbox">
                <input type="checkbox" name="simbolos" class="checkbox">
                <label for="simbolos">Símbolos</label>
            </div>
        </div>

        <div class="parametro">
            <h3 class="parametro-titulo">Força da senha</h3>
            <div class="barra-forca">
                <div class="forca fraca" id="indicador-forca"></div>
            </div>
            <p class="entropia" id="texto-entropia">Entropia: 0 bits</p>
        </div>
    </section>

    <script src="main.js"></script>
</body>
</html>
